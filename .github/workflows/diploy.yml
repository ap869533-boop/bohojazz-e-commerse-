name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: secrets.EC2_HOST is empty!"
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Agar server par project folder nahi hai, to clone karein
            if [ ! -d "~/bohojazz-e-commerse-" ]; then
              echo "Cloning repository..."
              git clone https://github.com/ap869533-boop/bohojazz-e-commerse-.git ~/bohojazz-e-commerse-
            fi
            
            # 2. Sahi folder ke andar jayein
            cd ~/bohojazz-e-commerse- || exit 1
            
            # 3. URL reset karein (Spelling fix)
            git remote set-url origin https://github.com/ap869533-boop/bohojazz-e-commerse-.git
            
            # 4. Latest code pull karein
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            # 🔥 DOCKER & ENV FIX: GitHub Secret se data lekar EC2 par automatic .env file banana
            echo "${{ secrets.BACKEND_ENV }}" > ~/bohojazz-e-commerse-/backend/.env

            # 5. Docker compose se teeno containers ko restart karna
            echo "Stopping old containers..."
            docker compose down || true
            
            echo "Building and starting Frontend, Backend, and Database..."
            docker compose up -d --build
          EOF