name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: secrets.EC2_HOST is empty!"
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          # StrictHostKeyChecking=no lagane se connection block nahi hoga
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Check karein agar project folder nahi hai to sahi repository clone karein
            if [ ! -d "~/bohojazz-e-commerce" ]; then
              git clone https://github.com/ap869533-boop/bohojazz-e-commerce-.git ~/bohojazz-e-commerce
            fi
            
            # 2. Project folder ke andar jayein
            cd ~/bohojazz-e-commerce
            
            # 3. GitHub se naya code pull karein
            git pull origin main

            # 4. Modern Docker Compose commands (bina hyphen ke)
            docker compose down || true
            docker compose up -d --build
          EOF