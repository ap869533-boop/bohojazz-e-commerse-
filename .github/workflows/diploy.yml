name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: secrets.EC2_HOST is empty!"
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Agar folder nahi hai, to direct HTTPS URL se bina token ke clone karein
            if [ ! -d "bohojazz-e-commerce-" ]; then
              echo "Cloning repository..."
              git clone https://github.com/ap869533-boop/bohojazz-e-commerce-.git
            fi
            
            # 2. Sahi folder ke andar jayein (Aapki repo ka naam bohojazz-e-commerce- hai)
            cd bohojazz-e-commerce- || cd ~/bohojazz-e-commerce- || exit 1
            
            # 3. URL ko simple reset karein
            git remote set-url origin https://github.com/ap869533-boop/bohojazz-e-commerce-.git
            
            # 4. Latest code pull karein
            git pull origin main

            # 5. Containers ko restart karein
            docker compose down || true
            docker compose up -d --build
          EOF