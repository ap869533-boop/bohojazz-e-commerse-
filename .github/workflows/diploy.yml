name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: secrets.EC2_HOST is empty!"
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Sahi spelling ke saath clone karein agar folder nahi hai (Public repository hai)
            if [ ! -d "bohojazz-e-commerse-" ]; then
              echo "Cloning repository with correct spelling..."
              git clone https://github.com/ap869533-boop/bohojazz-e-commerse-.git
            fi
            
            # 2. Sahi folder ke andar jayein
            cd bohojazz-e-commerse- || exit 1
            
            # 3. URL ko hamesha ke liye update rakhein
            git remote set-url origin https://github.com/ap869533-boop/bohojazz-e-commerse-.git
            
            # 4. Naya code pull karein
            git pull origin main

            # 5. Naye Docker Compose (v5.1.4 जो आपने इन्स्टॉल किया) se restart karein
            docker compose down || true
            docker compose up -d --build
          EOF