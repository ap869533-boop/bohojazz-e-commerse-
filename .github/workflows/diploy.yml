name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Actions khud code download karega
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. SSH configuration setup karna
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 3. Server par folder banana (agar pehle se na ho)
      - name: Create app directory on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/bohojazz-e-commerce-"

      # 4. GitHub se saara code direct EC2 server par transfer karna
      - name: Copy code to EC2 via SCP
        run: |
          scp -i ~/.ssh/id_rsa -r ./* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/bohojazz-e-commerce-/

      # 5. EC2 server ke andar sirf Docker containers start karna
      - name: Run Docker Compose on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/bohojazz-e-commerce- || exit 1
            
            # Purane containers ko rokna aur naye build karna
            docker compose down || true
            docker compose up -d --build
          EOF